---
env:
  contexts:
    - name: IMMUNICARE production local
      urls:
        - "http://127.0.0.1:5173"
        - "http://localhost:5173"
        - "http://127.0.0.1:3000"
        - "http://localhost:3000"
      includePaths:
        - "http://127\\.0\\.0\\.1:5173.*"
        - "http://localhost:5173.*"
        - "http://127\\.0\\.0\\.1:3000.*"
        - "http://localhost:3000.*"
      excludePaths:
        - ".*googleapis\\.com.*"
        - ".*gstatic\\.com.*"
        - ".*google\\.com.*"
        - ".*android\\.clients\\.google\\.com.*"
        - ".*passwordsleakcheck-pa\\.googleapis\\.com.*"
        - ".*optimizationguide-pa\\.googleapis\\.com.*"
        - ".*content-autofill\\.googleapis\\.com.*"
        - ".*cartocdn\\.com.*"
        - ".*arcgisonline\\.com.*"
        - ".*/node_modules/\\.vite/.*"
        - ".*/@react-refresh.*"
  parameters:
    failOnError: true
    failOnWarning: false
    continueOnFailure: false
    progressToStdout: true

jobs:
  - type: passiveScan-config
    parameters:
      scanOnlyInScope: true
      maxAlertsPerRule: 0

  - type: requestor
    requests:
      - url: "http://127.0.0.1:5173/"
      - url: "http://localhost:5173/"
      - url: "http://127.0.0.1:3000/"
      - url: "http://localhost:3000/"

  - type: spider
    parameters:
      context: IMMUNICARE production local
      url: "http://127.0.0.1:5173/"
      maxDuration: 2
      maxDepth: 5
      maxChildren: 50

  - type: passiveScan-wait
    parameters:
      maxDuration: 5

  - type: activeScan-config
    parameters:
      maxRuleDurationInMins: 1
      maxScanDurationInMins: 8
      maxAlertsPerRule: 10

  - type: activeScan
    parameters:
      context: IMMUNICARE production local
      url: "http://127.0.0.1:5173/"
      maxRuleDurationInMins: 1
      maxScanDurationInMins: 8

  - type: report
    parameters:
      template: traditional-html
      reportDir: "C:\\Users\\Gabriel\\Downloads\\Immunicare\\.codex-temp"
      reportFile: "zap-production-clean.html"
      reportTitle: "IMMUNICARE Clean Production ZAP Scan"
      reportDescription: "Clean local production scan against serve-local.cjs and server.js, excluding Vite development paths and external browser/background services."

  - type: exitStatus
    parameters:
      warnLevel: High
      errorLevel: High
